name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: CodeGo-Setup-Windows.exe
            artifact_glob: 'codego-platform/dist-electron-apps/*.exe'
          - os: macos-latest
            artifact_name: CodeGo-macOS.dmg
            artifact_glob: 'codego-platform/dist-electron-apps/*.dmg'
          - os: ubuntu-latest
            artifact_name: CodeGo-Linux.AppImage
            artifact_glob: 'codego-platform/dist-electron-apps/*.AppImage'

    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: codego-platform/package-lock.json

      - name: Install dependencies
        working-directory: codego-platform
        run: npm ci

      - name: Build Electron app (macOS - skip signing)
        if: matrix.os == 'macos-latest'
        working-directory: codego-platform
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npm run build:electron

      - name: Build Electron app (Windows/Linux)
        if: matrix.os != 'macos-latest'
        working-directory: codego-platform
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npm run build:electron

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release with downloads
        uses: softprops/action-gh-release@v2
        with:
          name: CodeGo ${{ github.ref_name }}
          body: |
            ## CodeGo Desktop App ${{ github.ref_name }}

            | Platform | File |
            |---|---|
            | Windows | CodeGo-Setup-Windows.exe |
            | macOS | CodeGo-macOS.dmg |
            | Linux | CodeGo-Linux.AppImage |
          files: release-assets/**/*
          draft: false
          prerelease: false
