name: 🧪 Selenium E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  selenium-e2e:
    name: Selenium E2E — Chrome Headless
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout repository ──────────────────────────────
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js setup ────────────────────────────────────
      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: codego-platform/package-lock.json

      # ── 3. Install frontend dependencies ───────────────────
      - name: 📦 Install frontend dependencies
        working-directory: codego-platform
        run: npm ci

      # ── 4. Build the Vite app (production build for CI) ─────
      - name: 🔨 Build Vite app
        working-directory: codego-platform
        run: npm run build:web
        env:
          NODE_ENV: production

      # ── 5. Install a lightweight static server ──────────────
      - name: 📡 Install serve
        run: npm install -g serve

      # ── 6. Serve the build in background ───────────────────
      - name: 🚀 Start static server (port 5173)
        working-directory: codego-platform
        run: serve -s dist -l 5173 &
        # give server a moment to start
      
      - name: ⏳ Wait for server to be ready
        run: npx wait-on http://localhost:5173 --timeout 30000

      # ── 7. Install Chrome & ChromeDriver ───────────────────
      - name: 🌐 Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── 8. Run Selenium tests ───────────────────────────────
      - name: 🧪 Run Selenium E2E tests (headless)
        working-directory: codego-platform
        run: npx mocha 'selenium-tests/tests/**/*.test.js' --timeout 30000 --reporter spec --exit
        env:
          BASE_URL: http://localhost:5173
          HEADLESS: 'true'

      # ── 9. Upload test report on failure ───────────────────
      - name: 📋 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-logs
          path: codego-platform/selenium-tests/reports/
          retention-days: 7
