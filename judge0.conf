# Judge0 CE Configuration
# Docs: https://github.com/judge0/judge0/blob/master/judge0.conf

################################################################################
# POSTGRES
################################################################################
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_password

################################################################################
# REDIS
################################################################################
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_URL=redis://judge0-redis:6379

################################################################################
# WORKERS
################################################################################
# Number of worker processes per worker container.
# Each worker handles one submission at a time.
# With 2 worker containers × 8 workers = 16 concurrent executions.
COUNT_OF_WORKERS=8

################################################################################
# SECURITY / LIMITS
################################################################################
# Allow all language IDs (don't restrict)
ALLOW_ENABLE_WAIT_RESULT=true
ENABLE_WAIT_RESULT=true

# Per-submission resource caps
CPU_TIME_LIMIT=10
MEMORY_LIMIT=1048576
MAX_MEMORY_LIMIT=2048000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# Max queue depth before Judge0 returns 503
# Increased from 200 to accommodate 2,000-user exam bursts
MAX_QUEUE_SIZE=5000

################################################################################
# LOGGING
################################################################################
RAILS_LOG_TO_STDOUT=true
